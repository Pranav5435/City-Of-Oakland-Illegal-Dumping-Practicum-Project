<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oakland Dumping</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏙️ Oakland Illegal Dumping Detection</h1>
            <p class="subtitle">Upload footage or images for review</p>
        </header>

        <div class="main-layout">
            <!-- Left: Upload Panel -->
            <div class="upload-panel">
                <div class="panel-label">📂 File Submission</div>

                <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
                    <div class="dropzone-icon">🖼️</div>
                    <div class="dropzone-text">Drop files here or <span>browse</span></div>
                    <div class="dropzone-sub">PNG, JPG, JPEG, WEBP — up to 10 files</div>
                </div>

                <input type="file" id="fileInput" accept="image/*" multiple>

                <div class="selected-files" id="selectedFiles">
                    <div class="selected-files-label">Selected</div>
                    <div id="fileList"></div>
                </div>

                <div class="btn-row">
                    <button class="btn-upload" onclick="document.getElementById('fileInput').click()">⬆ Upload</button>
                    <button class="btn-submit" id="submitBtn" disabled onclick="handleSubmit()">✓ Submit</button>
                </div>
            </div>

            <!-- Right: Gallery Panel -->
            <div class="gallery-panel">
                <div class="panel-label">🖼️ Uploaded Images</div>
                <div id="galleryEmpty" class="gallery-empty">
                    <div class="gallery-empty-icon">📭</div>
                    <div class="gallery-empty-text">No images uploaded yet</div>
                </div>
                <div class="image-grid" id="imageGrid"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/script.js"></script>
</body>
</html>
