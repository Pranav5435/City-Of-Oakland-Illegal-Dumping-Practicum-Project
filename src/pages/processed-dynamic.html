<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processed Dynamic Media</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <style>
        .results-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 24px;
        }

        .result-row {
            background: var(--card-bg, #16213e);
            border: 1px solid var(--border, #0f3460);
            border-radius: 12px;
            padding: 20px;
        }

        .result-row h3 {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 14px;
            word-break: break-all;
        }

        .video-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .video-pair figure {
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-pair figcaption {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
        }

        .video-pair video {
            width: 100%;
            border-radius: 8px;
            display: block;
            background: #000;
        }

        .video-placeholder {
            background: #0f3460;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: #aaa;
            font-size: 0.85rem;
            text-align: center;
            padding: 16px;
        }

        .meta-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
        }

        .meta-stat {
            flex: 1;
            background: #0f3460;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .meta-stat .value {
            font-size: 1.6rem;
            font-weight: bold;
            color: #e94560;
        }

        .meta-stat .label {
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 4px;
        }

        .events-section { margin-top: 8px; }

        .events-label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        .events-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
        }

        .events-table th {
            background: #0f3460;
            color: #aaa;
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
        }

        .events-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #0f3460;
            color: #ccc;
            vertical-align: middle;
        }

        .events-table tr:last-child td { border-bottom: none; }
        .events-table tr:hover td { background: rgba(15, 52, 96, 0.4); }

        .snapshot-thumb {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .snapshot-thumb:hover { transform: scale(1.05); }

        .badge-alert {
            background: #e94560;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
        }

        .progress-wrap { margin: 12px 0; }

        .progress-bar-bg {
            background: #0f3460;
            border-radius: 999px;
            height: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: #e94560;
            border-radius: 999px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .progress-label {
            font-size: 0.78rem;
            color: #aaa;
            margin-top: 6px;
        }

        .processing-indicator {
            text-align: center;
            color: #aaa;
            padding: 20px 0;
            font-size: 0.9rem;
        }

        .empty-state { color: #aaa; padding: 40px 0; }
        .empty-state a { color: #e94560; }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .lightbox.open { display: flex; }

        .lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 1.8rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Detection Results</h1>
            <p class="subtitle">AI-analyzed video with dumping detection events</p>
        </header>

        <div class="gallery-panel">
            <div class="panel-label">Results</div>

            <div id="processingIndicator" class="processing-indicator" style="display:none">
                ⏳ Uploading video and starting analysis...
            </div>

            <div id="emptyState" class="empty-state" style="display:none">
                <p>No results found. <a href="index.html">Go back and upload a video.</a></p>
            </div>

            <div id="resultsGrid" class="results-grid"></div>

            <div class="btn-row" style="margin-top: 24px; max-width: 320px;">
                <button class="btn-upload" type="button" onclick="window.location.href='index.html'">Back</button>
            </div>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <img id="lightboxImg" src="" alt="Detection snapshot">
    </div>

<script>
    // ========================================
    // IndexedDB video loader
    // ========================================
    const _IDB_NAME  = 'oaklandDumping';
    const _IDB_STORE = 'pendingVideos';

    function _openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(_IDB_NAME, 1);
            req.onupgradeneeded = e => e.target.result.createObjectStore(_IDB_STORE, { keyPath: 'id' });
            req.onsuccess = e => resolve(e.target.result);
            req.onerror   = e => reject(e.target.error);
        });
    }

    function loadVideosForProcessing() {
        return _openDB().then(db => new Promise((resolve, reject) => {
            const tx  = db.transaction(_IDB_STORE, 'readonly');
            const req = tx.objectStore(_IDB_STORE).getAll();
            req.onsuccess = e => resolve(e.target.result);
            req.onerror   = e => reject(e.target.error);
        }));
    }

    // ========================================
    // Helpers
    // ========================================

    const BACKEND_URL      = 'http://127.0.0.1:8000/api/detect-video';
    const POLL_INTERVAL_MS = 4000;

    function openLightbox(src) {
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, '0');
        const s = (sec % 60).toFixed(1).padStart(4, '0');
        return `${m}:${s}`;
    }

    function buildEventsTable(events) {
        if (!events || events.length === 0) {
            return `<div class="video-placeholder" style="min-height:60px">No dumping events detected</div>`;
        }
        const rows = events.map((ev, i) => {
            const regionSummary = ev.regions.map(r => `${r.w}×${r.h}px (area ${r.area})`).join(', ');
            const snapshotCell = ev.snapshot
                ? `<img class="snapshot-thumb" src="data:image/jpeg;base64,${ev.snapshot}" alt="Frame snapshot" onclick="openLightbox(this.src)">`
                : '—';
            return `
                <tr>
                    <td>${i + 1}</td>
                    <td><span class="badge-alert">ALERT</span></td>
                    <td>${formatTime(ev.timestamp_sec)}</td>
                    <td>Person #${ev.person_id}</td>
                    <td>${ev.regions.length} region(s) — ${regionSummary}</td>
                    <td>${snapshotCell}</td>
                </tr>`;
        }).join('');
        return `
            <table class="events-table">
                <thead>
                    <tr>
                        <th>#</th><th>Status</th><th>Timestamp</th>
                        <th>Subject</th><th>Regions</th><th>Frame</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    function pollUntilDone(jobId, progressBarFill, progressLabel) {
        return new Promise((resolve, reject) => {
            const interval = setInterval(function() {
                fetch(BACKEND_URL + '/' + jobId)
                    .then(r => r.json())
                    .then(data => {
                        progressBarFill.style.width = data.progress + '%';
                        progressLabel.textContent   = 'Processing… ' + data.progress + '%';
                        if (data.status === 'complete') {
                            clearInterval(interval);
                            resolve(data.result);
                        } else if (data.status === 'error') {
                            clearInterval(interval);
                            reject(new Error(data.error || 'Unknown error'));
                        }
                    })
                    .catch(err => { clearInterval(interval); reject(err); });
            }, POLL_INTERVAL_MS);
        });
    }

    // ========================================
    // Main
    // ========================================

    function runDetectionAndRender() {
        loadVideosForProcessing()
            .then(function(stored) {
                if (!stored || stored.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                var originalVideos = stored.map(function(v) {
                    return { name: v.name, dataUrl: URL.createObjectURL(v.file), file: v.file };
                });

                var grid      = document.getElementById('resultsGrid');
                var indicator = document.getElementById('processingIndicator');
                indicator.style.display = 'block';

                var chain = Promise.resolve();
                originalVideos.forEach(function(item) {
                    chain = chain.then(function() {
                        return processVideo(item, grid);
                    });
                });
                chain.then(function() {
                    indicator.style.display = 'none';
                });
            })
            .catch(function(err) {
                console.error('Failed to load videos from IndexedDB:', err);
                document.getElementById('emptyState').style.display = 'block';
            });
    }

    function processVideo(item, grid) {
        var name    = item.name;
        var dataUrl = item.dataUrl;
        var file    = item.file;
        var escapedName = CSS.escape(name);

        var row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML =
            '<h3>🎞️ ' + name + '</h3>' +
            '<div class="video-pair">' +
                '<figure>' +
                    '<video src="' + dataUrl + '" controls></video>' +
                    '<figcaption>Original</figcaption>' +
                '</figure>' +
                '<figure>' +
                    '<div class="video-placeholder" id="outputPane-' + escapedName + '">⏳ Processing…</div>' +
                    '<figcaption>Analysis Output</figcaption>' +
                '</figure>' +
            '</div>' +
            '<div class="progress-wrap" id="progressWrap-' + escapedName + '">' +
                '<div class="progress-bar-bg">' +
                    '<div class="progress-bar-fill" id="progressFill-' + escapedName + '"></div>' +
                '</div>' +
                '<div class="progress-label" id="progressLabel-' + escapedName + '">Uploading…</div>' +
            '</div>' +
            '<div class="meta-bar" id="metaBar-' + escapedName + '" style="display:none">' +
                '<div class="meta-stat"><div class="value" id="statFrames-' + escapedName + '">—</div><div class="label">Frames Processed</div></div>' +
                '<div class="meta-stat"><div class="value" id="statDetections-' + escapedName + '">—</div><div class="label">Dumping Events</div></div>' +
                '<div class="meta-stat"><div class="value" id="statDuration-' + escapedName + '">—</div><div class="label">Last Event (s)</div></div>' +
            '</div>' +
            '<div class="events-section" id="eventsSection-' + escapedName + '"></div>';
        grid.appendChild(row);

        var progressFill  = document.getElementById('progressFill-'  + escapedName);
        var progressLabel = document.getElementById('progressLabel-' + escapedName);
        var outputPane    = document.getElementById('outputPane-'    + escapedName);

        var formData = new FormData();
        formData.append('video', file, name);
        formData.append('skip_frames', '9');

        return fetch(BACKEND_URL, { method: 'POST', body: formData })
            .then(function(res) {
                if (!res.ok) throw new Error('Upload failed: ' + res.status);
                return res.json();
            })
            .then(function(data) {
                progressLabel.textContent = 'Analyzing video…';
                return pollUntilDone(data.job_id, progressFill, progressLabel);
            })
            .then(function(result) {
                document.getElementById('progressWrap-' + escapedName).style.display = 'none';

                var lastEvent   = result.events && result.events.length > 0 ? result.events[result.events.length - 1] : null;
                var durationSec = lastEvent ? lastEvent.timestamp_sec : '—';
                document.getElementById('statFrames-'     + escapedName).textContent = result.total_frames_processed;
                document.getElementById('statDetections-' + escapedName).textContent = result.total_detections;
                document.getElementById('statDuration-'   + escapedName).textContent = durationSec;
                document.getElementById('metaBar-'        + escapedName).style.display = 'flex';

                document.getElementById('eventsSection-' + escapedName).innerHTML =
                    '<div class="events-label">Detection Events</div>' +
                    buildEventsTable(result.events);

                outputPane.outerHTML = result.total_detections > 0
                    ? '<video controls style="width:100%;border-radius:8px;background:#000" src="http://127.0.0.1:8000/api/video-output/' + result.output_video_job_id + '"></video>'
                    : '<video controls style="width:100%;border-radius:8px;background:#000" src="http://127.0.0.1:8000/api/video-output/' + result.output_video_job_id + '"></video>';
            })
            .catch(function(err) {
                console.error('Detection failed for ' + name + ':', err);
                progressLabel.textContent = 'Error: ' + err.message;
                outputPane.textContent    = 'Detection failed: ' + err.message;
            });
    }

    runDetectionAndRender();
</script>
</body>
</html>
